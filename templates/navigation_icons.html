{# Shared outline geometry keeps navigation and page icons consistent at any display scale. #}
{% macro icon(name) -%}
<svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {% if name == 'overview' %}
  <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-8H9v8H4a1 1 0 0 1-1-1Z"/>
  {% elif name == 'jobs' %}
  <rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12a23 23 0 0 0 18 0M12 12v3"/>
  {% elif name == 'new' %}
  <rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 8v8M8 12h8"/>
  {% elif name == 'applications' %}
  <rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 12h6M9 17h4"/>
  {% elif name == 'preferences' %}
  <path d="M4 6h4m4 0h8M4 12h10m4 0h2M4 18h2m4 0h10"/><circle cx="10" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="8" cy="18" r="2"/>
  {% elif name == 'documents' %}
  <path d="M14 2H8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Zm0 0v6h6M3 6v14a2 2 0 0 0 2 2h11"/>
  {% elif name == 'profile' %}
  <circle cx="12" cy="8" r="4"/><path d="M4 21v-2a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v2"/>
  {% elif name == 'settings' %}
  <path d="m10 3-.6 2.4-2 .9-2.2-.7-2 3.4 1.7 1.7v2.6L3.2 15l2 3.4 2.2-.7 2 .9.6 2.4h4l.6-2.4 2-.9 2.2.7 2-3.4-1.7-1.7v-2.6L20.8 9l-2-3.4-2.2.7-2-.9L14 3Z"/><circle cx="12" cy="12" r="3"/>
  {% elif name == 'panel' %}
  <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>
  {% elif name == 'menu' %}
  <path d="M4 6h16M4 12h16M4 18h16"/>
  {% elif name == 'clock' %}
  <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
  {% elif name == 'check' %}
  <circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>
  {% elif name == 'arrow' %}
  <path d="M4 12h16m-6-6 6 6-6 6"/>
  {% elif name == 'search' %}
  <circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>
  {% elif name == 'upload' %}
  <path d="M12 16V3m-5 5 5-5 5 5M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/>
  {% elif name == 'letter' %}
  <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
  {% elif name == 'appearance' %}
  <circle cx="12" cy="12" r="9"/><path d="M12 3v18M12 6h6m-6 4h8m-8 4h8m-8 4h6"/>
  {% elif name == 'server' %}
  <rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M12 10v4"/>
  {% elif name == 'sparkles' %}
  <path d="m10 3 2.5 6.5L19 12l-6.5 2.5L10 21l-2.5-6.5L1 12l6.5-2.5ZM19 2v6m-3-3h6"/>
  {% endif %}
</svg>
{%- endmacro %}
