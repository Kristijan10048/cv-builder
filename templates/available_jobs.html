<section class="view" id="availableJobsView" aria-labelledby="availableJobsHeading">
  <h2 class="sr-only" id="availableJobsHeading">Available Jobs</h2>
  <div class="filters">
    <label class="search-field">{{ icon('search') }}<input id="availableJobsSearch" placeholder="Search fetched jobs" aria-label="Search fetched jobs"></label>
    <select id="availableJobsSite" aria-label="Filter by job board">
      <option value="">All boards</option><option value="linkedin">LinkedIn</option><option value="indeed">Indeed</option>
      <option value="glassdoor">Glassdoor</option><option value="zip_recruiter">ZipRecruiter</option>
      <option value="bayt">Bayt</option><option value="bdjobs">BDJobs</option><option value="naukri">Naukri</option>
    </select>
  </div>
  <p id="jobSearchStatus" role="status" aria-live="polite" class="subcopy job-search-status"></p>
  <p id="jobSearchWarnings" role="alert" class="preference-error hidden"></p>
  <p class="subcopy" id="availableJobsNote" aria-live="polite">No fetched jobs yet.</p>
  <div class="application-table-wrap">
    <table class="application-table available-jobs-table" aria-describedby="availableJobsNote">
      <caption class="sr-only">Fetched job postings</caption><thead><tr>
        <th scope="col">Company</th><th scope="col">Title</th><th scope="col">Location</th>
        <th scope="col" title="Explicit language requirements detected in the job description">Language</th>
        <th scope="col">Source</th><th scope="col">Date Fetched</th><th scope="col">Job link</th><th scope="col">Applied</th>
      </tr></thead>
      <tbody id="availableJobsList"><tr><td colspan="8"><div class="empty-state"><strong>No fetched jobs yet</strong>Select a saved search and fetch jobs to explore opportunities.</div></td></tr></tbody>
    </table>
  </div>
  <nav class="job-pagination" aria-label="Available jobs pages">
    <label>Jobs per page<select id="availableJobsPageSize"><option value="10">10</option><option value="20" selected>20</option><option value="50">50</option></select></label>
    <div><button type="button" class="secondary" id="jobsPrevious" disabled>Previous</button>
      <span id="jobsPageLabel" role="status">Page 1 of 1</span>
      <button type="button" class="secondary" id="jobsNext" disabled>Next</button></div>
  </nav>
</section>
