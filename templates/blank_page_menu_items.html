<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Blank Page with Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0d0d0d;
      color: #e4e4e4;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .layout {
      display: flex;
      min-height: 100vh;
    }

    /* ── Sidebar ─────────────────────────────────────────── */
    .sidebar {
      width: 240px;
      background: rgba(13,13,13,0.95);
      border-right: 1px solid rgba(255,255,255,0.06);
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .sidebar-logo {
      display: flex; align-items: center; gap: 10px;
      padding: 4px 8px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 12px;
    }
    .sidebar-logo .logo {
      width: 30px; height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .sidebar-logo h1 {
      font-size: 15px; font-weight: 600; color: #fff;
    }
    .menu-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #525252;
      padding: 16px 12px 6px;
    }
    .menu-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      color: #a1a1a6;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: color .2s, background .2s;
    }
    .menu-item:hover { color: #fff; background: rgba(255,255,255,0.06); }
    .menu-item.active { color: #fff; background: rgba(255,255,255,0.1); }
    .menu-item svg { width: 16px; height: 16px; flex-shrink: 0; }
    .sidebar-spacer { flex: 1; }

    /* ── Main content ────────────────────────────────────── */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(13,13,13,0.6);
      backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 50;
    }
    .topbar-title {
      font-size: 16px; font-weight: 600; color: #fff;
    }
    .topbar-spacer { flex: 1; }
    .hamburger {
      display: none;
      background: none; border: none; color: #e4e4e4; cursor: pointer;
      padding: 4px;
    }
    .hamburger svg { width: 20px; height: 20px; }

    main {
      flex: 1;
      padding: 32px 24px 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .center-placeholder {
      text-align: center;
      color: #525252;
      font-size: 14px;
    }

    /* ── Grid view ───────────────────────────────────────── */
    .grid-container {
      width: 100%;
      max-width: 1200px;
    }
    .grid-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .grid-toolbar .col-count-label {
      font-size: 13px;
      color: #a1a1a6;
    }
    .grid-toolbar .col-count-value {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      min-width: 24px;
      text-align: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 6px;
      background: rgba(255,255,255,0.08);
      color: #e4e4e4;
      cursor: pointer;
      font-size: 18px;
      font-weight: 600;
      transition: background .2s, color .2s;
    }
    .btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
    .btn:disabled { opacity: 0.3; cursor: default; }
    .btn:disabled:hover { background: rgba(255,255,255,0.08); color: #e4e4e4; }
    .grid {
      display: grid;
      gap: 12px;
      width: 100%;
    }
    .grid-cell {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #525252;
      transition: background .2s;
    }
    .grid-cell:hover { background: rgba(255,255,255,0.07); }

    /* ── Overlay for mobile ──────────────────────────────── */
    .sidebar-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 40;
    }

    /* ── Responsive ──────────────────────────────────────── */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        z-index: 50;
        transform: translateX(-100%);
        transition: transform .25s ease;
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.visible { display: block; }
      .hamburger { display: block; }
      main { padding: 20px 16px 40px; }
    }
  </style>
</head>
<body>

<div class="layout">

  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
      </div>
      <h1>Home Server</h1>
    </div>

    <div class="menu-label">Navigation</div>

    <a class="menu-item active" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      Dashboard
    </a>

    <a class="menu-item" href="/blank_page.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/>
      </svg>
      Blank Page
    </a>

    <a class="menu-item" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
      </svg>
      Terminal
    </a>

    <a class="menu-item" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
      </svg>
      Database
    </a>

    <a class="menu-item" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
      </svg>
      Files
    </a>

    <a class="menu-item" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
      </svg>
      Logs
    </a>

    <a class="menu-item" href="#" data-view="grid">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      Grid
    </a>

    <div class="menu-label">Settings</div>

    <a class="menu-item" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      Settings
    </a>

    <a class="menu-item" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Logout
    </a>

    <div class="sidebar-spacer"></div>
  </aside>

  <!-- Main -->
  <div class="main-content">
    <div class="topbar">
      <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <span class="topbar-title">Blank Page</span>
      <div class="topbar-spacer"></div>
    </div>

    <main id="mainContent">
      <div class="center-placeholder" id="placeholderView">
        Center content area
      </div>
      <div class="grid-container" id="gridView" style="display:none;">
        <div class="grid-toolbar">
          <button class="btn" id="removeColBtn" title="Remove column" disabled>−</button>
          <span class="col-count-label">Columns:</span>
          <span class="col-count-value" id="colCountValue">3</span>
          <button class="btn" id="addColBtn" title="Add column">+</button>
        </div>
        <div class="grid" id="grid"></div>
      </div>
    </main>
  </div>
</div>

<script>
  const sidebar     = document.getElementById('sidebar');
  const overlay     = document.getElementById('sidebarOverlay');
  const hamburger   = document.getElementById('hamburgerBtn');
  const mainContent = document.getElementById('mainContent');
  const placeholder = document.getElementById('placeholderView');
  const gridView    = document.getElementById('gridView');
  const grid        = document.getElementById('grid');
  const colCountVal = document.getElementById('colCountValue');
  const addColBtn   = document.getElementById('addColBtn');
  const removeColBtn= document.getElementById('removeColBtn');
  const topbarTitle = document.querySelector('.topbar-title');

  let columnCount = 3;

  /* ── Menu item switching ─────────────────────────────── */
  const menuItems = document.querySelectorAll('.sidebar .menu-item');
  const viewMap   = { grid: 'Grid' };

  menuItems.forEach(item => {
    item.addEventListener('click', e => {
      e.preventDefault();
      menuItems.forEach(m => m.classList.remove('active'));
      item.classList.add('active');

      const view = item.dataset.view;
      if (view) {
        showView(view);
      } else {
        placeholder.style.display = '';
        gridView.style.display    = 'none';
        topbarTitle.textContent   = 'Home Server';
      }
    });
  });

  function showView(view) {
    placeholder.style.display = 'none';
    if (view === 'grid') {
      gridView.style.display = '';
      topbarTitle.textContent = 'Grid';
      renderGrid();
    }
  }

  /* ── Grid rendering ──────────────────────────────────── */
  function renderGrid() {
    grid.style.gridTemplateColumns = `repeat(${columnCount}, 1fr)`;
    grid.innerHTML = '';
    const totalCells = columnCount * 3; // 3 rows
    for (let i = 0; i < totalCells; i++) {
      const cell = document.createElement('div');
      cell.className = 'grid-cell';
      cell.textContent = `Cell ${i + 1}`;
      grid.appendChild(cell);
    }
    colCountVal.textContent = columnCount;
    updateColButtons();
  }

  function updateColButtons() {
    removeColBtn.disabled = columnCount <= 1;
    addColBtn.disabled    = columnCount >= 12;
  }

  addColBtn.addEventListener('click', () => {
    if (columnCount < 12) { columnCount++; renderGrid(); }
  });

  removeColBtn.addEventListener('click', () => {
    if (columnCount > 1) { columnCount--; renderGrid(); }
  });

  /* ── Sidebar toggle ──────────────────────────────────── */
  function openSidebar()  { sidebar.classList.add('open');    overlay.classList.add('visible'); }
  function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('visible'); }

  hamburger.addEventListener('click', () => sidebar.classList.contains('open') ? closeSidebar() : openSidebar());
  overlay.addEventListener('click', closeSidebar);
</script>

</body>
</html>
